name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен под сборку."

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 xz-utils file ca-certificates

    - name: Download and Extract Image Builder
      run: |
        # Качаем из постоянного архивного хранилища OpenWrt (Attic Archive), где файлы лежат вечно
        URL="https://openwrt.org"
        
        echo "Скачивание Image Builder из официального архива OpenWrt..."
        curl -k -L "$URL" -o openwrt-imagebuilder.tar.xz --connect-timeout 30 --retry 5
        
        # Проверка типа файла перед распаковкой
        if file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text"; then
          echo "Критическая ошибка: Архив не получен. Содержимое ответа сервера:"
          cat openwrt-imagebuilder.tar.xz
          exit 1
        fi
        
        echo "Архив успешно получен. Распаковка..."
        tar -xf openwrt-imagebuilder.tar.xz
        mv openwrt-imagebuilder-21.02.7-ramips-rt305x.Linux-x86_64 imagebuilder
        rm openwrt-imagebuilder.tar.xz

    - name: Build Firmware Image
      run: |
        cd imagebuilder
        
        # Перенаправляем менеджер пакетов на архивный сервер, чтобы все зависимости скачались успешно
        sed -i 's|downloads.openwrt.org|archive.openwrt.org|g' repositories.conf
        
        # Конфигурация пакетов под 8MB Flash / 32MB RAM роутера DIR-620 A1 в ветке 21.02
        # LuCI включена, тяжелый mbedtls заменен на wolfssl, добавлены RNDIS/CDC драйверы модемов
        PACKAGES="luci \
                  -ppp -ppp-mod-pppoe \
                  -wpad-basic-mbedtls wpad-basic-wolfssl \
                  kmod-usb2 kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis"
        
        make image PROFILE=dlink_dir-620-a1 PACKAGES="$PACKAGES"

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        cp imagebuilder/bin/targets/ramips/rt305x/*sysupgrade.bin output/

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
