name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен."

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 xz-utils file

    - name: Download and Extract Image Builder
      run: |
        # Используем децентрализованный и открытый CDN, который никогда не блокирует GitHub Actions
        URL="https://jsdelivr.net"
        
        # Если jsDelivr не содержит этот таргет, качаем с альтернативного архивного прокси (OSDN / SourceForge Mirror)
        URL_ALT="https://archive.org"
        
        # Самый надежный прямой сервер без защиты Cloudflare (прямой IP репозитория во Франции)
        URL_DIRECT="http://allnetitalia.it"

        echo "Скачивание Image Builder с Allnet Italia Direct Mirror..."
        curl -L "$URL_DIRECT" -o openwrt-imagebuilder.tar.xz --connect-timeout 20 --retry 5
        
        # Резервный шаг на случай сбоя
        if file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text|empty"; then
          echo "Прямое зеркало недоступно. Пробуем CDN jsDelivr..."
          curl -L "$URL" -o openwrt-imagebuilder.tar.xz --connect-timeout 20 --retry 5
        fi
        
        if file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text|empty"; then
          echo "Пробуем Internet Archive Mirror..."
          curl -L "$URL_ALT" -o openwrt-imagebuilder.tar.xz --connect-timeout 20 --retry 5
        fi
        
        # Проверка типа файла перед распаковкой
        if file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text"; then
          echo "Критическая ошибка: Все зеркала заблокированы. Содержимое ответа:"
          cat openwrt-imagebuilder.tar.xz
          exit 1
        fi
        
        echo "Архив успешно получен. Распаковка..."
        tar -xf openwrt-imagebuilder.tar.xz
        mv openwrt-imagebuilder-22.03.7-ramips-rt305x.Linux-x86_64 imagebuilder
        rm openwrt-imagebuilder.tar.xz

    - name: Build Firmware Image
      run: |
        cd imagebuilder
        
        # Подменяем внутренние репозитории пакетов Image Builder на стабильный Allnet / Кюри прокси,
        # чтобы в процессе сборки утилита make image не наткнулась на блокировку основного сайта
        sed -i 's|downloads.openwrt.org|pub.allnetitalia.it/mirror/openwrt|g' repositories.conf
        
        # Конфигурация пакетов под 8MB Flash / 32MB RAM роутера DIR-620 A1
        # LuCI включена, тяжемый mbedtls заменен на wolfssl, добавлены RNDIS/CDC драйверы
        PACKAGES="luci \
                  -ppp -ppp-mod-pppoe \
                  -wpad-basic-mbedtls wpad-basic-wolfssl \
                  kmod-usb2 kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis"
        
        make image PROFILE=dlink_dir-620-a1 PACKAGES="$PACKAGES"

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        cp imagebuilder/bin/targets/ramips/rt305x/*sysupgrade.bin output/

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
