name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен."

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 xz-utils file

    - name: Download and Extract Image Builder
      run: |
        # Список зеркал (Kernel.org, Университет Кюри во Франции и Университет Умео в Швеции)
        URL1="https://kernel.org"
        URL2="https://curie.fr"
        URL3="https://umu.se"
        
        USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        
        echo "Попытка 1: Скачивание с Linux Foundation (Kernel.org)..."
        curl -L -A "$USER_AGENT" "$URL1" -o openwrt-imagebuilder.tar.xz --connect-timeout 15 --retry 3 || true
        
        # Если первый файл битый или не скачался, переходим к зеркалу №2
        if [ ! -f openwrt-imagebuilder.tar.xz ] || file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text|empty"; then
          echo "Kernel.org недоступен или выдал ошибку. Попытка 2: Зеркало Curie (Франция)..."
          curl -L -A "$USER_AGENT" "$URL2" -o openwrt-imagebuilder.tar.xz --connect-timeout 15 --retry 3 || true
        fi
        
        # Если все еще ошибка, переходим к зеркалу №3
        if [ ! -f openwrt-imagebuilder.tar.xz ] || file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text|empty"; then
          echo "Зеркало Curie выдало ошибку. Попытка 3: Зеркало Umeå (Швеция)..."
          curl -L -A "$USER_AGENT" "$URL3" -o openwrt-imagebuilder.tar.xz --connect-timeout 15 --retry 3 || true
        fi
        
        # Финальная проверка скачанного файла перед распаковкой
        if [ ! -f openwrt-imagebuilder.tar.xz ] || file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text"; then
          echo "Критическая ошибка: Ни одно из зеркал не отдало бинарный архив прошивки."
          [ -f openwrt-imagebuilder.tar.xz ] && cat openwrt-imagebuilder.tar.xz
          exit 1
        fi
        
        echo "Архив успешно получен. Распаковка..."
        tar -xf openwrt-imagebuilder.tar.xz
        mv openwrt-imagebuilder-22.03.7-ramips-rt305x.Linux-x86_64 imagebuilder
        rm openwrt-imagebuilder.tar.xz

    - name: Build Firmware Image
      run: |
        cd imagebuilder
        
        # Настраиваем внутренние репозитории пакетов Image Builder на работу через стабильное зеркало Kernel.org,
        # чтобы на этапе make image сборщик скачивал пакеты без блокировок
        sed -i 's|downloads.openwrt.org|mirrors.kernel.org/openwrt|g' repositories.conf
        
        # Оптимальная конфигурация пакетов под 8MB Flash / 32MB RAM роутера DIR-620 A1
        # LuCI включена, тяжелый mbedtls заменен на компактный wolfssl, добавлены RNDIS/CDC драйверы модемов
        PACKAGES="luci \
                  -ppp -ppp-mod-pppoe \
                  -wpad-basic-mbedtls wpad-basic-wolfssl \
                  kmod-usb2 kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis"
        
        make image PROFILE=dlink_dir-620-a1 PACKAGES="$PACKAGES"

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        cp imagebuilder/bin/targets/ramips/rt305x/*sysupgrade.bin output/

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
