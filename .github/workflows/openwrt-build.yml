name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен под сборку."

    - name: Build Firmware via Official OpenWrt Docker Image
      uses: ghaction-net/openwrt-imagebuilder@main
      with:
        # Указываем нужную вам версию и архитектуру роутера
        release: 22.03.7
        target: ramips
        subtarget: rt305x
        profile: dlink_dir-620-a1
        
        # Конфигурация пакетов под 8MB Flash / 32MB RAM
        # Оставляем веб-интерфейс LuCI, отключаем тяжелый mbedtls и ppp/pppoe
        # Включаем компактный wolfssl и сетевые драйверы для современных USB-модемов
        packages: >-
          luci
          -ppp
          -ppp-mod-pppoe
          -wpad-basic-mbedtls
          wpad-basic-wolfssl
          kmod-usb2
          kmod-usb-net
          kmod-usb-net-cdc-ether
          kmod-usb-net-rndis

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        # Находим готовый файл sysupgrade в папке билдера и копируем его
        find bin/ -name "*sysupgrade.bin" -exec cp {} output/ \; 2>/dev/null || true
        # Если структура папок отличается, копируем все скомпилированные образы
        cp -r bin/targets/ramips/rt305x/*sysupgrade.bin output/ 2>/dev/null || true

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
