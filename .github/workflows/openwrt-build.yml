name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен."

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 xz-utils

    - name: Download and Extract Image Builder
      run: |
        # Используем надежное немецкое университетское зеркало (RWTH Aachen), где нет защиты от ботов
        URL="https://rwth-aachen.de"
        
        echo "Скачивание Image Builder с академического зеркала..."
        curl -L "$URL" -o openwrt-imagebuilder.tar.xz --connect-timeout 20 --retry 5
        
        # Проверяем, что скачался именно архив, а не текст/HTML
        if file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text"; then
          echo "Ошибка: Сервер вернул текст вместо архива! Пробуем резервное зеркало..."
          URL_BACKUP="https://openwrt.org"
          curl -L "$URL_BACKUP" -o openwrt-imagebuilder.tar.xz --connect-timeout 20 --retry 5
        fi
        
        if file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text"; then
          echo "Критическая ошибка: Скачать архив не удалось."
          cat openwrt-imagebuilder.tar.xz
          exit 1
        fi
        
        echo "Архив успешно получен. Распаковка..."
        tar -xf openwrt-imagebuilder.tar.xz
        mv openwrt-imagebuilder-22.03.7-ramips-rt305x.Linux-x86_64 imagebuilder
        rm openwrt-imagebuilder.tar.xz

    - name: Build Firmware Image
      run: |
        cd imagebuilder
        
        # Подменяем источники пакетов внутри самого Image Builder на зеркало, 
        # чтобы этап скачивания пакетов при сборке тоже не споткнулся о проверку на бота
        sed -i 's|downloads.openwrt.org|ftp.halifax.rwth-aachen.de/openwrt|g' repositories.conf
        
        # Оптимальная конфигурация пакетов под 8MB Flash / 32MB RAM
        PACKAGES="luci \
                  -ppp -ppp-mod-pppoe \
                  -wpad-basic-mbedtls wpad-basic-wolfssl \
                  kmod-usb2 kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis"
        
        make image PROFILE=dlink_dir-620-a1 PACKAGES="$PACKAGES"

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        cp imagebuilder/bin/targets/ramips/rt305x/*sysupgrade.bin output/

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
