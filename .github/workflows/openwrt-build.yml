name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен."

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 xz-utils file

    - name: Download and Extract Image Builder
      run: |
        # Используем стабильное крупное зеркало без систем фильтрации ботов (Яндекс или OVH)
        URL="http://yandex.ru"
        URL_ALT="https://ovh.net"
        
        echo "Скачивание Image Builder с Yandex Mirror..."
        curl -L "$URL" -o openwrt-imagebuilder.tar.xz --connect-timeout 20 --retry 5
        
        # Если Яндекс недоступен из дата-центра GitHub, используем французское зеркало OVH
        if file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text|empty"; then
          echo "Яндекс зеркало не отдало архив. Пробуем альтернативное зеркало OVH..."
          curl -L "$URL_ALT" -o openwrt-imagebuilder.tar.xz --connect-timeout 20 --retry 5
        fi
        
        # Финальная проверка типа файла перед распаковкой
        if file openwrt-imagebuilder.tar.xz | grep -q -E "HTML|text"; then
          echo "Критическая ошибка: Скачать бинарный архив не удалось. Получен HTML:"
          cat openwrt-imagebuilder.tar.xz
          exit 1
        fi
        
        echo "Архив успешно получен. Распаковка..."
        tar -xf openwrt-imagebuilder.tar.xz
        mv openwrt-imagebuilder-22.03.7-ramips-rt305x.Linux-x86_64 imagebuilder
        rm openwrt-imagebuilder.tar.xz

    - name: Build Firmware Image
      run: |
        cd imagebuilder
        
        # Меняем внутренние репозитории пакетов Image Builder на зеркало Яндекса, 
        # чтобы при компиляции пакеты скачивались без блокировок Cloudflare
        sed -i 's|downloads.openwrt.org|mirror.yandex.ru/mirrors/openwrt|g' repositories.conf
        
        # Конфигурация пакетов под 8MB Flash / 32MB RAM роутера DIR-620 A1
        # LuCI включена, тяжелый mbedtls заменен на wolfssl, добавлены RNDIS/CDC драйверы
        PACKAGES="luci \
                  -ppp -ppp-mod-pppoe \
                  -wpad-basic-mbedtls wpad-basic-wolfssl \
                  kmod-usb2 kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis"
        
        make image PROFILE=dlink_dir-620-a1 PACKAGES="$PACKAGES"

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        cp imagebuilder/bin/targets/ramips/rt305x/*sysupgrade.bin output/

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
