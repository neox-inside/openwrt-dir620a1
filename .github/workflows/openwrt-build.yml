name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # Используем самую свежую версию Ubuntu

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Использует актуальный релиз v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /etc/apt/sources.list.d/*

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

    - name: Download and Extract Image Builder
      run: |
        wget https://openwrt.org
        tar -xf openwrt-imagebuilder-22.03.7-ramips-rt305x.Linux-x86_64.tar.xz
        mv openwrt-imagebuilder-22.03.7-ramips-rt305x.Linux-x86_64 imagebuilder

    - name: Build Firmware Image
      run: |
        cd imagebuilder
        
        # Конфигурация пакетов под 8MB Flash:
        # Убираем ppp/pppoe, заменяем wpad на облегченный wolfssl
        # Добавляем LuCI и сетевые драйверы для современных USB-модемов
        PACKAGES="luci \
                  -ppp -ppp-mod-pppoe \
                  -wpad-basic-mbedtls wpad-basic-wolfssl \
                  kmod-usb2 kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis"
        
        make image PROFILE=dlink_dir-620-a1 PACKAGES="$PACKAGES"

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        cp imagebuilder/bin/targets/ramips/rt305x/*sysupgrade.bin output/ || echo "Файл не найден, сборка упала выше"

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
