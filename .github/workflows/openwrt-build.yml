name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен под сборку."

    - name: Build Firmware via Official OpenWrt ImageBuilder Action
      uses: izer-xyz/openwrt-imagebuilder-action@v7
      with:
        # Конфигурация под архитектуру D-Link DIR-620 A1
        image: ramips-rt305x
        profile: dlink_dir-620-a1
        openwrt-version: 22.03.7
        
        # Набор пакетов для 8MB Flash / 32MB RAM
        # Включаем LuCI, урезаем тяжелый mbedtls и ppp/pppoe,
        # добавляем wolfssl и драйверы модемов (RNDIS/CDC-Ethernet)
        packages: >-
          luci
          -ppp
          -ppp-mod-pppoe
          -luci-proto-ppp
          -wpad-basic-mbedtls
          -wpad-basic-wolfssl
          wpad-mini
          kmod-usb-core
          kmod-usb2
          kmod-usb-net
          kmod-usb-net-cdc-ether
          kmod-usb-net-rndis
          kmod-usb-storage
          kmod-scsi-core

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        # Копируем готовые бинарные образы sysupgrade из рабочей директории экшена в выходную папку
        find bin/ -name "*sysupgrade.bin" -exec cp {} output/ \; 2>/dev/null || true

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
