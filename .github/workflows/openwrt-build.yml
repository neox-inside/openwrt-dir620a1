name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен."

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

    - name: Download and Extract Image Builder
      run: |
        # Скачиваем строго по прямой ссылке на архив
        URL="https://openwrt.org"
        echo "Скачивание Image Builder с $URL..."
        wget -q --show-progress "$URL" -O openwrt-imagebuilder.tar.xz
        
        # Проверяем, что файл скачался и имеет корректный размер
        if [ ! -s openwrt-imagebuilder.tar.xz ]; then
          echo "Ошибка: Файл не скачался или пуст!"
          exit 1
        fi
        
        echo "Распаковка архива..."
        tar -xf openwrt-imagebuilder.tar.xz
        
        # Находим распакованную папку и переименовываем её для удобства
        FOLDER_NAME=$(tar -tf openwrt-imagebuilder.tar.xz | head -1 | cut -f1 -d"/")
        mv "$FOLDER_NAME" imagebuilder
        rm openwrt-imagebuilder.tar.xz

    - name: Build Firmware Image
      run: |
        cd imagebuilder
        
        # Оптимальные пакеты для D-Link DIR-620 A1 (8MB Flash / 32MB RAM)
        # Оставляем веб-интерфейс LuCI, убираем тяжелый mbedtls и ppp/pppoe
        # Включаем wolfssl и поддержку современных USB-модемов (CDC-Ethernet, RNDIS)
        PACKAGES="luci \
                  -ppp -ppp-mod-pppoe \
                  -wpad-basic-mbedtls wpad-basic-wolfssl \
                  kmod-usb2 kmod-usb-net kmod-usb-net-cdc-ether kmod-usb-net-rndis"
        
        make image PROFILE=dlink_dir-620-a1 PACKAGES="$PACKAGES"

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        cp imagebuilder/bin/targets/ramips/rt305x/*sysupgrade.bin output/

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
