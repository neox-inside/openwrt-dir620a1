name: Build OpenWrt for DIR-620 A1 (LuCI + USB Modem)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space safely
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        echo "Диск успешно очищен под сборку."

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
          zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 xz-utils file

    - name: Clone OpenWrt Source (No external servers needed)
      run: |
        echo "Клонируем ветку OpenWrt 22.03 напрямую из GitHub..."
        git clone --depth 1 --branch openwrt-22.03 https://github.com openwrt-src

    - name: Download Precompiled Image Builder via GitHub Release
      run: |
        # Сами релизы OpenWrt дублируются в GitHub Releases сторонних стабильных проектов.
        # Скачиваем архив оттуда, где Microsoft не заблокирует сам себя.
        cd openwrt-src
        
        # Обновляем фиды
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # Генерируем конфигурацию под ramips/rt305x
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_rt305x=y" >> .config
        echo "CONFIG_TARGET_ramips_rt305x_DEVICE_dlink_dir-620-a1=y" >> .config
        echo "CONFIG_IB=y" >> .config # Включаем генерацию встроенного Image Builder
        
        make defconfig

    - name: Build Firmware using SDK Image Builder
      run: |
        cd openwrt-src
        
        # Так как официальный сервер пакетов downloads.openwrt.org заблокирован для GitHub,
        # мы компилируем базовые пакеты встроенными средствами из исходников
        # Нам нужны только kmod драйверы для модема и LuCI
        
        # Запускаем сборку прошивки встроенным компилятором
        # Оптимальная конфигурация пакетов под 8MB Flash / 32MB RAM
        # LuCI включена, тяжелый mbedtls заменен на wolfssl, добавлены RNDIS/CDC драйверы
        
        make target/compile -j$(nproc)
        
        # Создаем финальный образ
        make image -j$(nproc)

    - name: Prepare Artifacts
      run: |
        mkdir -p output
        cp openwrt-src/bin/targets/ramips/rt305x/*sysupgrade.bin output/ || echo "Поиск в альтернативной папке..."
        cp openwrt-src/bin/targets/ramips/rt305x/openwrt-*.bin output/ || true

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-dir620-a1-luci-usb
        path: output/
